---
- name: Create nvim config directory
  ansible.builtin.file:
    path: "~/.config/nvim"
    state: directory
    mode: '0750'

- name: Copy nvim config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "~/.config/nvim/{{ item }}"
    mode: '0640'
  loop:
    - init.lua
    - nvim.vim
    - lazy-lock.json
    - .stylua.toml

- name: Copy nvim runtime directories
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: ~/.config/nvim/
    mode: '0640'
    directory_mode: '0750'
  loop:
    - lua
    - lsp
    - colors
    - tests

- name: Remove obsolete Neovim Vimscript entry point
  ansible.builtin.file:
    path: "~/.config/nvim/init.vim"
    state: absent

- name: Create efm config directory
  ansible.builtin.file:
    path: "~/.config/efm-langserver/"
    state: directory
    mode: '0750'

- name: Copy efm config
  ansible.builtin.copy:
    src: efm.yaml
    dest: ~/.config/efm-langserver/config.yaml
    mode: '0640'
