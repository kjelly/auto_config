symbol = '☁️ az '
disabled = true

[gcloud]
symbol = '☁️ 🇬️ '
disabled = true

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
# Do not restrict discovery to the current directory or KUBECONFIG.
# The default ~/.kube/config remains discoverable.

[[kubernetes.contexts]]
# Distinct text marker as well as color: readable in monochrome terminals.
context_pattern = '(^|.*[-_./:@])(prod|production)([-_./:@].*|$)'
style = 'bold red'
symbol = 'PROD '

[git_metrics]
# This module was listed in the original prompt but disabled by default.
disabled = false

[git_status]
# v1.25+: show Index (S) and Working Tree (W) independently.
# Avoid $all_status here: it would double-count some statuses.
format = '([\[$conflicted$stashed$renamed$untracked$index_added$index_modified$index_deleted$index_typechanged$worktree_added$worktree_modified$worktree_deleted$worktree_typechanged$ahead_behind\]]($style) )'
index_added = '[S+${count}](green) '
index_modified = '[S~${count}](green) '
index_deleted = '[S-${count}](green) '
index_typechanged = '[S>${count}](green) '
worktree_added = '[W+${count}](yellow) '
worktree_modified = '[W~${count}](yellow) '
worktree_deleted = '[W-${count}](yellow) '
worktree_typechanged = '[W>${count}](yellow) '

[python]
disabled = true

[nodejs]
disabled = true

[status]
disabled = false

[memory_usage]
disabled = false
threshold = 85
format = '[RAM $ram_pct]($style) '
style = 'bold red'

[opa]
disabled = true

[lua]
disabled = true

[java]
disabled = true
